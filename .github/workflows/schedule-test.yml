name: Schedule heartbeat

# TEMPORARY DIAGNOSTIC — delete once it has answered its question.
#
# The daily brief's cron has fired zero times out of two chances. Everything
# checkable is correct: public repo, not a fork, default branch, workflow
# enabled, valid cron, file pushed, and manual dispatch works. So either
# GitHub dropped both runs (it is documented as best-effort, and drops happen
# under load), or `schedule` does not fire in this repo at all.
#
# Guessing between those has already cost two days of posts. This settles it:
# it runs every 5 minutes -- GitHub's floor -- and does nothing but print the
# time. Sample size is the whole point: two missed dailies could be bad luck,
# but ~100 missed heartbeats in a day could not be. If runs with a "schedule"
# trigger appear, the scheduler works here and the daily was unlucky. If none
# do, scheduling is broken for this repo and the trigger has to come from
# outside GitHub.
on:
  schedule:
    - cron: '*/5 * * * *'      # 5 min is GitHub's floor; fastest evidence available
  workflow_dispatch:

permissions: {}

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "fired at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "trigger: ${{ github.event_name }}"
