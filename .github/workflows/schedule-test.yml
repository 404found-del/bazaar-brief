name: Schedule heartbeat

# TEMPORARY DIAGNOSTIC — delete once it has answered its question.
#
# The daily brief's cron has fired zero times out of two chances. Everything
# checkable is correct: public repo, not a fork, default branch, workflow
# enabled, valid cron, file pushed, and manual dispatch works. So either
# GitHub dropped both runs (it is documented as best-effort, and drops happen
# under load), or `schedule` does not fire in this repo at all.
#
# Guessing between those has already cost two days of posts. This settles it:
# it runs every 15 minutes and does nothing but print the time. If runs with
# a "schedule" trigger appear within an hour, the scheduler works and the
# daily was unlucky. If none appear, scheduling is broken here and we stop
# relying on it.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "fired at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "trigger: ${{ github.event_name }}"
