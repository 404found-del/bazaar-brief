name: Data check (fetch real market data, render, publish nothing)

# Manual. The whole point is to see what LIVE data produces before any of it
# goes near Instagram. Nothing here touches the Meta API at all.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter || true
          fc-list | grep -qi "Inter" || { echo "::error::Inter not available"; exit 1; }

      - name: Install Python deps
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: What does the market actually say?
        run: python market_data.py | tee market.json

      - name: Render the carousel from live data
        run: |
          python run_daily.py --base-url "https://example.invalid/preview"
          echo "--- caption ---"
          cat caption.txt

      # The slides are the deliverable here: download them from this run,
      # look at them, and only then decide whether to schedule anything.
      - name: Upload slides and raw data
        uses: actions/upload-artifact@v4
        with:
          name: live-preview
          path: |
            docs/slides/**
            market.json
            caption.txt
