name: Dry run (build a carousel, stop before posting)

# Manual only. Proves the whole chain — render, host, build containers —
# without putting anything on the grid.
on:
  workflow_dispatch:
    inputs:
      publish_for_real:
        description: 'Actually publish to Instagram? Type "yes" to post.'
        required: true
        default: 'no'

# Pages is deployed straight from the build artifact rather than committed.
# Meta copies each image when it publishes, so the URLs only need to be live
# for a few minutes — committing them would grow the repo ~1.2MB every day,
# permanently, for files nobody reads again.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Asks GitHub where this site will actually live. Do NOT assume
      # <owner>.github.io/<repo>: a custom domain on the user site (here,
      # dataarchitect.studio) is inherited by every project page, and the
      # github.io address then permanently redirects to it.
      - name: Work out the real Pages URL
        id: pages
        uses: actions/configure-pages@v5

      # Inter is the whole visual identity. Without it the slides still
      # render, just noticeably worse — so fail here rather than discover it
      # on a published post.
      - name: Install Inter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter || true
          if ! fc-list | grep -qi "Inter"; then
            mkdir -p ~/.fonts
            curl -sL -o /tmp/inter.zip \
              https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
            unzip -oq /tmp/inter.zip -d /tmp/inter
            find /tmp/inter -name '*.ttf' -exec cp {} ~/.fonts/ \;
            fc-cache -f
          fi
          fc-list | grep -qi "Inter" || { echo "::error::Inter not available"; exit 1; }

      - name: Install Python deps
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render the carousel
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -z "$PAGES_BASE" ]; then
            echo "::error::Pages base URL is empty — is Pages enabled with source 'GitHub Actions'?"
            exit 1
          fi
          # Meta fetches these server-side and is happier over TLS.
          PAGES_BASE="${PAGES_BASE/#http:/https:}"
          echo "serving slides from $PAGES_BASE"
          python run_daily.py --sample --base-url "$PAGES_BASE"

      - name: Show the caption
        run: cat caption.txt

      - name: Keep a copy of the slides on the run
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: docs/slides/**

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Deployment reports success slightly before the CDN serves the files.
      # Pages legitimately 301s (canonicalisation, HTTPS enforcement), so
      # follow redirects — but report where we landed, because a redirect to
      # github.com/login means the repo is PRIVATE and Pages is gated.
      - name: Wait for the slides to actually serve
        run: |
          URL=$(python -c "import json;print(json.load(open('urls.json'))[0])")
          echo "polling $URL"
          for i in $(seq 1 30); do
            # `read` returns non-zero at EOF and curl's -w output has no
            # trailing newline, which under `set -e` kills the step on the
            # first attempt instead of retrying. Parse positionally instead.
            RESP=$(curl -sL -o /dev/null \
              -w '%{http_code} %{content_type} %{url_effective}' "$URL" || echo "000 - -")
            set -- $RESP
            CODE=$1; TYPE=$2; FINAL=$3
            if [ "$CODE" = "200" ]; then
              case "$TYPE" in
                image/*) echo "live after ~$((i*10))s ($TYPE)"; exit 0 ;;
                *) echo "::error::$URL served $TYPE, not an image. Landed on: $FINAL"
                   echo "::error::If that is a github.com login page, the repo is private — Pages needs it public on the free plan."
                   exit 1 ;;
              esac
            fi
            echo "  attempt $i: HTTP $CODE -> $FINAL"
            sleep 10
          done
          echo "::error::slides never became reachable. Last URL: $FINAL"
          echo "::error::Check Settings > Pages source is 'GitHub Actions', and that the repo is Public."
          exit 1

      - name: Build the carousel (dry run — nothing is posted)
        if: ${{ github.event.inputs.publish_for_real != 'yes' }}
        env:
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
        run: python publish.py --urls urls.json --caption caption.txt --dry-run

      - name: Publish for real
        if: ${{ github.event.inputs.publish_for_real == 'yes' }}
        env:
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
        run: python publish.py --urls urls.json --caption caption.txt
